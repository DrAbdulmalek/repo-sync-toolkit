name: 🛡️ Security Gate

# بوابة أمنية إلزامية: لا تعتمد على فحص الأسرار وحده، بل تمنع **النمط**
# الذي يضع بيانات الاعتماد داخل عنوان Git.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read          # أقل صلاحية ممكنة

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: secrets + credential-url + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: python -m pip install -U pip pytest

      - name: Secret scan (all tracked files)
        run: python scan_secrets.py --all

      - name: Credential-in-URL pattern gate
        run: python scripts/check_no_credentials_in_urls.py --json gate-report.json

      - name: Bash syntax check
        run: |
          shopt -s nullglob globstar
          fail=0
          for f in *.sh config/*.sh sync-scripts/*.sh scripts/*.sh; do
            [ -f "$f" ] || continue
            if bash -n "$f"; then echo "OK   $f"; else echo "FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: Python syntax check
        run: python -m compileall -q . -x '(\.git|legacy|__pycache__)'

      - name: Credential hygiene tests
        run: python -m pytest tests/ -q

      - name: Orchestrator dry-run (no writes, no network)
        run: python master_orchestrator.py

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: gate-report.json
          if-no-files-found: ignore
